<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a07">
<title>醫家 도감 — 名·字·號·著書</title>
<style>
:root{--bg:#0d0a07;--panel:#171109;--card:#1f160c;--cardh:#2a1d0f;--ink:#ece2cf;--muted:#b6a585;--dim:#7d6f57;--zhu:#cf4a2c;--bronze:#c9962e;--jade:#6cae8b;--warn:#d6a23a;--line:#3a2c1a;--line2:#503c22;
 --serif:"Nanum Myeongjo","Noto Serif KR","Batang",AppleMyungjo,"Apple SD Gothic Neo",serif;--sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 90px}
header{padding:4px 2px 12px;border-bottom:1px solid var(--line)}
.ttl{font-size:28px;font-weight:800;letter-spacing:2px}.ttl .zhu{color:var(--zhu)}
.sub{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
.sub a{color:var(--bronze)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 8px;scrollbar-width:none}
.tab{flex:0 0 auto;padding:9px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--panel);color:var(--muted);font:700 14px var(--serif);cursor:pointer;white-space:nowrap}
.tab .n{display:block;font-size:10px;color:var(--dim);font-weight:600;letter-spacing:1px}
.tab.active{color:var(--ink);border-color:var(--bronze);background:linear-gradient(180deg,#241809,#1a1108)}
.panel{display:none}.panel.active{display:block}
.ghint{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;line-height:1.6}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.stat span{font:12px var(--sans);color:var(--muted);border:1px solid var(--line2);border-radius:14px;padding:4px 10px;background:var(--panel)}
.stat b{color:var(--bronze)}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--bronze)}
button.pri{border-color:var(--bronze);background:#2a1d0f;font-weight:800}
button:disabled{opacity:.4;cursor:default}
/* 도감 */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{padding:6px 10px;font-size:13px}
.filters button.on{border-color:var(--bronze);color:var(--bronze)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pc{border:1px solid var(--line2);background:var(--card);border-radius:12px;padding:12px 14px}
.pc .h{display:flex;justify-content:space-between;align-items:baseline}
.pc .nm{font-size:22px;font-weight:800}
.pc .nm small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px;font-family:var(--sans)}
.pc .era{font:12px var(--sans);color:var(--dim)}
.row{display:flex;gap:8px;margin-top:6px;font-size:14.5px;line-height:1.45}
.row .k{flex:0 0 34px;font:700 11px var(--sans);color:var(--dim);padding-top:3px;letter-spacing:1px}
.row .v{flex:1}
.zi{color:var(--jade);font-weight:700}.hao{color:var(--bronze);font-weight:700}
.why{font:12px var(--sans);color:var(--muted);margin-left:4px}
.tag{display:inline-block;font:11px var(--sans);padding:1px 6px;border-radius:8px;border:1px solid var(--line2);color:var(--dim);margin-left:4px}
.hook{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.flag{color:var(--warn);font:12px var(--sans)}
.mask .zi,.mask .hao,.mask .bk{filter:blur(6px);cursor:pointer}
.mask .zi.show,.mask .hao.show,.mask .bk.show{filter:none}
/* 훈련 */
.qcard{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:18px 18px 16px;max-width:680px}
.qk{font:12px var(--sans);color:var(--dim);letter-spacing:1px}
.qq{font-size:20px;line-height:1.55;margin:8px 0 14px}
.qq b{color:var(--bronze);font-size:26px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;font:18px var(--serif);background:#120d07;color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.inrow input:focus{outline:none;border-color:var(--bronze)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{text-align:left;font-size:16px}
.opts button.ok{border-color:var(--jade);background:rgba(108,174,139,.15)}
.opts button.no{border-color:var(--zhu);background:rgba(207,74,44,.15)}
.fb{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;line-height:1.6}
.fb .v{font-weight:800;font-size:16px}.fb .v.ok{color:var(--jade)}.fb .v.no{color:var(--zhu)}.fb .v.half{color:var(--warn)}
.grade{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.small{font:12px var(--sans);color:var(--dim)}
kbd{font:11px var(--sans);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;margin-left:4px;color:var(--muted)}
/* 표 */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font:700 12px var(--sans);color:var(--dim);letter-spacing:1px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.rules .pc h3{margin:0 0 6px;font-size:16px;color:var(--bronze)}
.rules .pc p{margin:4px 0;font-size:13.5px;line-height:1.6;color:var(--muted)}
.rules .pc p b{color:var(--ink)}
@media(max-width:600px){.opts{grid-template-columns:1fr}.qq{font-size:18px}}
</style>
</head>

P.forEach(function(p,i){p.i=i;p.label=p.alias||p.n;});
var SURNAMES=["王","張","李","吳","朱","孫","陳","楊","劉","葉"];
var ERAS=["戰國","東漢","晉","梁(南北朝)","唐","北宋","南宋","金","金元","元","明","淸","朝鮮"];

/* ─────────── 저장 (SRS) ─────────── */
var KEY="uihaksa_uiga_v1",INT=[0,1,2,4,7,14,30,60];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return iso(new Date());}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d);}
var DB;try{DB=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){DB={};}DB.c=DB.c||{};DB.log=DB.log||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function sched(id,grade){ /* grade: 0 틀림 · 1 반쯤(선지로 맞춤) · 2 맞음 */
  var c=DB.c[id]||{lv:0,due:null,n:0,w:0}; c.n++;
  if(grade===2){c.lv=Math.min(INT.length-1,c.lv+1);} else if(grade===1){c.lv=Math.max(1,c.lv);} else {c.lv=1;c.w++;}
  c.due=addDays(today(),grade===0?1:INT[c.lv]); c.last=today(); DB.c[id]=c;
  var t=today();DB.log[t]=DB.log[t]||{a:0,c:0};DB.log[t].a++;if(grade===2)DB.log[t].c++;save();
  try{window.HubHome&&HubHome.record&&HubHome.record("uiga",id,{wrong:grade===0});}catch(e){}
}

/* ─────────── 문항 생성: 사람 × 방향 ─────────── */
function items(){
  var out=[];
  P.forEach(function(p){
    if(p.zi) out.push({id:p.i+"|zi",p:p,dir:"名→字",q:"<b>"+p.label+"</b>의 字는?",ans:[p.zi,p.zk],show:p.zi,pool:"zi"});
    if(p.hao.length) out.push({id:p.i+"|hao",p:p,dir:"名→號",q:"<b>"+p.label+"</b>의 號는?",ans:p.hao.concat(p.hk||[]),show:p.hao.join(" · "),pool:"hao"});
    out.push({id:p.i+"|bk",p:p,dir:"名→著書",q:"<b>"+p.label+"</b>의 著書 하나는?",ans:p.bk.map(clean),show:p.bk.join(" · "),pool:"bk"});
    out.push({id:p.i+"|rbk",p:p,dir:"著書→名",q:"「<b>"+p.bk[0]+"</b>」의 저자는?",ans:[p.n,p.nk].concat(p.alias?[p.alias]:[]),show:p.label,pool:"n"});
    if(p.zi||p.hao.length){var t=p.hao.length&&(p.i%2||!p.zi)?p.hao[0]:p.zi;out.push({id:p.i+"|rzh",p:p,dir:(t===p.zi?"字":"號")+"→名",q:"<b>"+t+"</b>(은)는 누구의 "+(t===p.zi?"字":"號")+"인가?",ans:[p.n,p.nk].concat(p.alias?[p.alias]:[]),show:p.label,pool:"n"});}
  });
  return out;
}
function clean(s){return String(s).replace(/\(.*?\)/g,"").trim();}
var ITEMS=items(),BYID={};ITEMS.forEach(function(it){BYID[it.id]=it;});
function norm(s){return String(s||"").replace(/[\s·・,()（）「」『』]/g,"").replace(/先生|老人|山人|居士$/,function(m){return m;}).toLowerCase();}
function loose(x,a){var y=norm(a);x=norm(x);return !!x&&!!y&&(y===x||(y.length>=3&&x.length>=2&&y.indexOf(x)===0&&x.length>=y.length-2));}
function matchAns(input,it){return it.ans.some(function(a){return loose(input,a);});}
function distractors(it,n){
  var pool=[],p=it.p;
  P.forEach(function(o){if(o===p)return;
    if(it.pool==="zi"&&o.zi)pool.push([o.zi,o.n[0]===p.n[0]?3:(o.era===p.era?2:1)]);
    if(it.pool==="hao")o.hao.forEach(function(h){pool.push([h,o.n[0]===p.n[0]?3:(o.era===p.era?2:1)]);});
    if(it.pool==="bk")pool.push([o.bk[0],o.n[0]===p.n[0]?3:(o.era===p.era?2:1)]);
    if(it.pool==="n")pool.push([o.label,o.n[0]===p.n[0]?3:(o.era===p.era?2:1)]);
  });
  // 字↔號 혼동 유도: 같은 사람의 다른 칸을 오답으로
  if(it.pool==="zi"&&p.hao.length)pool.push([p.hao[0],5]);
  if(it.pool==="hao"&&p.zi)pool.push([p.zi,5]);
  pool.sort(function(a,b){return b[1]-a[1]+Math.random()*1.6-0.8;});
  var seen={},out=[];seen[it.show]=1;
  pool.forEach(function(x){if(out.length<n&&!seen[x[0]]){seen[x[0]]=1;out.push(x[0]);}});
  return out;
}

var TABS=[{n:"훈련",k:"drill",l:"오늘의 인출"},{n:"도감",k:"book",l:"醫家 도감"},{n:"함정",k:"sur",l:"同姓·字號 함정"},{n:"규칙",k:"rule",l:"字·號 규칙"}];
var tabsEl=document.getElementById("tabs"),main=document.getElementById("main"),cur=null;
TABS.forEach(function(t){var b=document.createElement("button");b.className="tab";b.innerHTML='<span class="n">'+t.n+'</span>'+t.l;b.onclick=function(){go(t.k);};b.dataset.k=t.k;tabsEl.appendChild(b);});
function go(k){cur=k;[].forEach.call(tabsEl.children,function(b){b.classList.toggle("active",b.dataset.k===k);});({drill:drill,book:book,sur:sur,rule:rule})[k]();}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function stats(){var t=today(),due=0,newc=0,learn=0,solid=0;ITEMS.forEach(function(it){var c=DB.c[it.id];if(!c)newc++;else{if(c.due<=t)due++;if(c.lv>=5)solid++;else learn++;}});return{due:due,newc:newc,learn:learn,solid:solid,total:ITEMS.length};}

/* 훈련 — 2단계 인출: ① 직접 쓰기(한자 또는 독음) → ② 못 떠오르면 선지 */
var Q=null;
function buildQueue(){var t=today(),due=[],fresh=[];ITEMS.forEach(function(it){var c=DB.c[it.id];if(c&&c.due<=t)due.push(it);else if(!c)fresh.push(it);});
  shuffle(due);
  // 새 문항은 사람 단위로 — 한 사람의 네 방향이 하루에 흩어져 나오게
  var people={};fresh.forEach(function(it){(people[it.p.i]=people[it.p.i]||[]).push(it);});var ids=Object.keys(people);shuffle(ids);
  var newToday=[];ids.slice(0,6).forEach(function(i){newToday=newToday.concat(people[i]);});shuffle(newToday);
  return due.concat(newToday).slice(0,40);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function drill(){
  var s=stats();
  main.innerHTML='<div class="panel active"><div class="ghint">이름을 보고 <b>먼저 직접 쓴다</b>(한자 또는 한글 독음). 안 떠오르면 「선지 보기」 — 선지로 맞히면 반쯤 안 것으로, 내일 다시 나온다. 字를 묻는데 號를 쓰면 그것도 알려 준다.</div>'+
   '<div class="stat"><span>오늘 복습 <b>'+s.due+'</b></span><span>새 사람 <b>'+Math.min(6,Math.ceil(s.newc/4))+'</b>명</span><span>익히는 중 '+s.learn+'</span><span>단단함(30일+) <b>'+s.solid+'</b>/'+s.total+'</span></div>'+
   '<div id="qbox"></div></div>';
  Q={list:buildQueue(),i:0,ok:0,half:0,no:0};
  if(!Q.list.length){document.getElementById("qbox").innerHTML='<div class="qcard"><div class="qq">오늘 할 것이 없다. 도감에서 가리고 훑어보거나 내일 다시.</div><button class="pri" id="more">새 사람 6명 더</button></div>';document.getElementById("more").onclick=function(){Q.list=ITEMS.filter(function(it){return!DB.c[it.id];}).slice(0,24);if(Q.list.length)showQ();};return;}
  showQ();
}
function showQ(){
  var box=document.getElementById("qbox");if(Q.i>=Q.list.length){box.innerHTML='<div class="qcard"><div class="qq">끝 — 맞음 <b style="font-size:20px">'+Q.ok+'</b> · 선지로 '+Q.half+' · 틀림 '+Q.no+'</div><div class="small">틀린 사람은 도감에서 갈고리 한 줄을 직접 고쳐 써 보라. 자기 말로 쓴 갈고리가 남는다.</div><div class="grade"><button class="pri" id="again">한 번 더</button><button id="tobook">도감으로</button></div></div>';document.getElementById("again").onclick=drill;document.getElementById("tobook").onclick=function(){go("book");};return;}
  var it=Q.list[Q.i];
  box.innerHTML='<div class="qcard"><div class="qk">'+it.dir+' · '+(Q.i+1)+'/'+Q.list.length+' · '+esc(it.p.era)+'</div><div class="qq">'+it.q+'</div>'+
   '<div class="inrow"><input id="ans" autocomplete="off" placeholder="한자 또는 독음으로 쓰기"><button class="pri" id="sub">확인 <kbd>Enter</kbd></button></div>'+
   '<div class="grade"><button id="opt">선지 보기 <kbd>Tab</kbd></button><button id="idk">모르겠다</button></div><div id="optbox"></div><div id="fb"></div></div>';
  var inp=document.getElementById("ans");inp.focus();
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();submit(inp.value,2);}if(e.key==="Tab"){e.preventDefault();showOpts();}};
  document.getElementById("sub").onclick=function(){submit(inp.value,2);};
  document.getElementById("opt").onclick=showOpts;document.getElementById("idk").onclick=function(){finish(0,"");};
}
function showOpts(){var it=Q.list[Q.i];if(Q.answered)return;var o=shuffle([it.show].concat(distractors(it,3)));var ob=document.getElementById("optbox");
  ob.innerHTML='<div class="opts">'+o.map(function(x,k){return'<button data-v="'+esc(x)+'">'+(k+1)+'. '+esc(x)+'</button>';}).join("")+'</div>';
  [].forEach.call(ob.querySelectorAll("button"),function(b){b.onclick=function(){var ok=b.dataset.v===it.show;b.classList.add(ok?"ok":"no");[].forEach.call(ob.querySelectorAll("button"),function(x){if(x.dataset.v===it.show)x.classList.add("ok");x.disabled=true;});finish(ok?1:0,b.dataset.v);};});
  document.addEventListener("keydown",optKey);}
function optKey(e){var ob=document.getElementById("optbox");if(!ob||Q.answered){document.removeEventListener("keydown",optKey);return;}var n=+e.key;if(n>=1&&n<=4){var b=ob.querySelectorAll("button")[n-1];if(b)b.click();}}
function submit(v,grade){var it=Q.list[Q.i];if(Q.answered||!v.trim())return;var ok=matchAns(v,it);finish(ok?2:0,v);}
function finish(grade,given){
  var it=Q.list[Q.i];if(Q.answered)return;Q.answered=true;document.removeEventListener("keydown",optKey);sched(it.id,grade);
  if(grade===2)Q.ok++;else if(grade===1)Q.half++;else Q.no++;
  var p=it.p,note="";
  // 字/號 혼동 진단
  if(grade===0&&given){var g=norm(given);if(it.pool==="zi"&&p.hao.concat(p.hk||[]).some(function(h){return loose(given,h);}))note="그건 <span class='hao'>號</span>다 — 字를 물었다.";
   else if(it.pool==="hao"&&[p.zi,p.zk].some(function(h){return h&&loose(given,h);}))note="그건 <span class='zi'>字</span>다 — 號를 물었다.";
   else{var other=P.find(function(o){return o!==p&&([o.zi,o.zk].concat(o.hao,o.hk||[],o.bk.map(clean),[o.n,o.nk,o.alias]).some(function(h){return h&&loose(given,h);}));});if(other)note="그건 <b>"+esc(other.label)+"</b>("+esc(other.era)+")의 것 — "+esc(other.n[0]===p.n[0]?"同姓 함정":"다른 사람");}}
  var v=grade===2?'<span class="v ok">맞음</span>':grade===1?'<span class="v half">선지로 맞춤 — 내일 다시</span>':'<span class="v no">'+(given?'틀림':'모름')+' — '+esc(it.show)+'</span>';
  document.getElementById("fb").innerHTML='<div class="fb">'+v+(note?'<div>'+note+'</div>':'')+card(p,true)+'<div class="grade"><button class="pri" id="nx">다음 <kbd>Enter</kbd></button>'+(grade===2?'':'')+'</div></div>';
  var nx=document.getElementById("nx");nx.focus();nx.onclick=function(){Q.answered=false;Q.i++;showQ();};
}
function card(p,inline){
  return '<div class="'+(inline?'':'pc')+'" style="'+(inline?'margin-top:8px':'')+'">'+
   (inline?'':'<div class="h"><span class="nm">'+esc(p.n)+'<small>'+esc(p.nk)+'</small></span><span class="era">'+esc(p.era)+'</span></div>')+
   (p.alias?'<div class="row"><span class="k">通稱</span><span class="v">'+esc(p.alias)+' <span class="why">— 字로 불린다</span></span></div>':'')+
   '<div class="row"><span class="k">字</span><span class="v">'+(p.zi?'<span class="zi">'+esc(p.zi)+'</span> <span class="small">'+esc(p.zk)+'</span>'+(p.why?'<span class="why">— '+esc(p.why)+'</span>':''):'<span class="small">—</span>')+'</span></div>'+
   '<div class="row"><span class="k">號</span><span class="v">'+(p.hao.length?'<span class="hao">'+p.hao.map(esc).join(' · ')+'</span> <span class="small">'+esc((p.hk||[]).join(' · '))+'</span>'+(p.haoNote?'<span class="why">— '+esc(p.haoNote)+'</span>':''):'<span class="small">—</span>')+'</span></div>'+
   (p.sch?'<div class="row"><span class="k">稱·派</span><span class="v">'+esc(p.sch)+'</span></div>':'')+
   '<div class="row"><span class="k">著書</span><span class="v bk">'+p.bk.map(function(b){return'「'+esc(b)+'」';}).join(' ')+'</span></div>'+
   '<div class="hook">'+esc(p.hook)+(p.flag?' <span class="flag">※ '+esc(p.flag)+'</span>':'')+'</div></div>';
}

  var rows=SURNAMES.map(function(s){var ps=P.filter(function(p){return p.n[0]===s||(p.alias&&p.alias[0]===s);});if(ps.length<2)return'';return'<tr><td style="font-size:22px;font-weight:800;color:var(--bronze)">'+s+'</td><td>'+ps.map(function(p){return'<div><b>'+esc(p.label)+'</b> <span class="small">'+esc(p.era)+'</span> — '+(p.zi?'<span class="zi">'+esc(p.zi)+'</span> ':'')+(p.hao.length?'<span class="hao">'+esc(p.hao[0])+'</span> ':'')+'「'+esc(p.bk[0])+'」</div>';}).join('')+'</td></tr>';}).join('');
  main.innerHTML='<div class="panel active"><div class="ghint">출제자가 오답을 만드는 재료는 같은 성씨와, 같은 사람의 字·號 뒤섞기다. 아래 표를 가리고 성씨만 보며 몇 명이 떠오르는지 세어 보라.</div><table><tr><th>姓</th><th>사람 — 字 · 號 · 대표 著書</th></tr>'+rows+'</table>'+
   '<h3 style="color:var(--bronze);margin:22px 2px 6px">字인가 號인가 — 30초</h3><div class="ghint">단어 하나를 보고 字·號·地名(稱)·尊稱 중 무엇인지 고른다. 規則(접미사·풀이)로 풀 수 있는 것만 낸다.</div><div id="zh"></div></div>';
  zhRound();
}
function zhPool(){var o=[];P.forEach(function(p){if(p.zi)o.push({w:p.zi,t:"字",p:p});p.hao.forEach(function(h){o.push({w:h,t:"號",p:p});});});
  o.push({w:"河間",t:"地名",p:P.find(function(p){return p.n==="劉完素";})},{w:"易水",t:"地名",p:P.find(function(p){return p.n==="張元素";})},{w:"扁鵲",t:"稱號",p:P[0]},{w:"醫聖",t:"稱號",p:P[1]},{w:"藥王",t:"稱號",p:P.find(function(p){return p.n==="孫思邈";})});return shuffle(o);}
var ZH=null;
